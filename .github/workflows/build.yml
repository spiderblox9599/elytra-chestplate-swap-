name: Final Phone Mod Builder
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract All Files Safely
        run: |
          sudo apt-get install unzip
          # Kisi bhi zip file ko poori tarah unzip karne ka command
          find . -name "*.zip" -exec unzip -o {} \;
          
          # Agar files kisi andar wale folder me hain, to unhe root me lana
          find . -maxdepth 3 -name "build.gradle" | while read -r line; do
            dir=$(dirname "$line")
            if [ "$dir" != "." ]; then
              cp -r "$dir"/* .
            fi
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Jar File
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Download Your Mod
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-Jar
          path: "**/build/libs/*.jar"
