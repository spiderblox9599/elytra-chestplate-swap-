name: Final Phone Mod Builder
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract Specific ZIP File
        run: |
          # Aapki file ke special characters ko handle karke unzip karne ka command
          sudo apt-get install unzip
          unzip -o "Spiderblox's Elytra Swap 1.21.11.zip" || unzip -o *.zip || true
          
          # Zip ke andar ke sahi folder me jaakar files ko bahar nikalna
          if [ -d "ElytraSwap" ]; then
            cp -r ElytraSwap/* .
          elif [ -d "Spiderblox's Elytra Swap 1.21.11" ]; then
            cp -r "Spiderblox's Elytra Swap 1.21.11"/* .
          fi
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Jar File
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Download Your Mod
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-Jar
          path: "**/build/libs/*.jar"
